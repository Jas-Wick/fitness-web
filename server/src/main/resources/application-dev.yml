server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fitness?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

fitness:
  admin:
    password: admin123
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

# 本地开发专用 JWT 密钥（仅限 localhost，生产走环境变量 JWT_SECRET）
jwt:
  secret: fitness-web-dev-secret-only-for-localhost-2026
